<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h1>ログイン</h1>

    <form method="post">
        <label>ユーザー名</label>
        <input type="text" name="username"><br><br>

        <label>パスワード</label>
        <input type="password" name="password"><br><br>

        <button type="submit">ログイン</button>
    </form>

    <p><a href="/register">ユーザー登録はこちらです</a></p>
    <p><a href="/">メモ一覧へ戻る</a></p>
</body>
</html>
