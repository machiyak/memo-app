<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Memo App</title>
</head>
<body>
    <h1>Memo App</h1>
    
    <!-- メモ入力フォーム -->
     <form method="post">
        <textarea name="content" rows="4" cols="50"></textarea>
        <button type="submit">送信</button>
     </form>

    <!-- pythonで記録したlistを表示 -->
    {% for memo in memos %}
        <h2>送信されたメモ</h2>
        <p>{{ memo }}</p>
    {% endfor %}
</body>
</html>
