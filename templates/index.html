<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Memo App</title>
</head>
<body>
    <h1>Memo App</h1>
    
    <!-- セッションの識別 -->
    {% if session.get("username") %}
        <p>ログイン中: {{ session.get("username") }}</p>
    {% else %}
        <p>ログインしていません</p>
    {% endif %}

    <!-- ログイン中とログアウト中で分ける -->
    <p>
        <a href="/register">ユーザー登録</a>
        |
        {% if session.get("username") %}
            <a href="/logout">ログアウト</a>
        {% else %}
            <a href="/login">ログイン</a>
        {% ednif %}
    </p>

    <!-- メモ入力フォーム -->
    <form method="post">
        <textarea name="content" rows="4" cols="50"></textarea>
        <button type="submit">保存</button>
    </form>

    <h2>メモ一覧</h2>

    <!-- DBに記録したメモを表示 -->
    {% for memo in memos %}
        <p>{{ memo["content"] }}</p>
        <small>{{ memo["created_at"] }}</small>
        <hr>
    {% endfor %}
</body>
</html>
